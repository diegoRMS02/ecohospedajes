<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Registro | EcoHospedajes Rurales</title>
    <link rel="stylesheet" href="/css/registrate.css" />
  </head>
  <body>
    <div class="login-container">
      <div class="login-box">
        <div class="logo">
          <img src="/img/logo.jpg" alt="Logo " />
          <h2>EcoHospedajes Rurales</h2>
        </div>

        <h1>Regístrate en nuestra plataforma</h1>

        <form id="formRegistro">
          <input type="text" id="nombre" placeholder="Nombre" required />
          <input type="text" id="apellidos" placeholder="Apellidos" required />
          <input
            type="email"
            id="email"
            placeholder="Correo electrónico"
            required
          />
          <input
            type="password"
            id="contrasena"
            placeholder="Contraseña"
            required
          />
          <button type="submit">Registrarme</button>
        </form>

        <p class="switch-text">
          ¿Ya tienes una cuenta?
          <a href="/login.html">Inicia sesión</a>
        </p>
      </div>
    </div>

    <script>
      document
        .getElementById("formRegistro")
        .addEventListener("submit", async (e) => {
          e.preventDefault();

          const data = {
            nombre: document.getElementById("nombre").value,
            apellidos: document.getElementById("apellidos").value,
            email: document.getElementById("email").value,
            password: document.getElementById("contrasena").value,
            rol: "CLIENTE",
          };

          try {
            // Usamos ruta relativa (mejor práctica que localhost duro)
            const response = await fetch("/api/usuarios/registro", {
              method: "POST",
              headers: { "Content-Type": "application/json" },
              body: JSON.stringify(data),
            });

            if (response.ok) {
              alert("✅ Registro exitoso. Ahora inicia sesión.");
              window.location.href = "/login.html";
            } else {
              // MEJORA: Leemos el mensaje real del servidor
              // Spring suele devolver un JSON con "message" o "mensaje" en caso de error 500/400
              try {
                const errorJson = await response.json();
                // Buscamos el mensaje en varios lugares posibles
                const msg =
                  errorJson.message ||
                  errorData.mensaje ||
                  "Error desconocido en el servidor";
                alert("❌ Error: " + msg);
              } catch (parseError) {
                // Si no devuelve JSON (ej. un error 404 plano)
                alert(
                  "❌ Ocurrió un error en el servidor. Intenta con otro correo."
                );
              }
            }
          } catch (error) {
            console.error(error);
            alert("Error de conexión (Backend apagado o red)");
          }
        });
    </script>
  </body>
</html>
