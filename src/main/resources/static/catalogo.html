<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Catálogo | EcoHospedajes Rurales</title>
    <link rel="stylesheet" href="/css/catalogo.css" />
  </head>
  <body>
    <header class="navbar">
      <div class="logo">
        <img src="/img/logo.jpg" alt="Logo" class="icono" />
        <div>
          <h1>EcoHospedajes Rurales</h1>
          <p>Reservas en hospedajes rurales</p>
        </div>
      </div>
      <nav id="menuNav">
        <a href="/index.html">Inicio</a>
        <a href="/login.html">Iniciar Sesión</a>
      </nav>
    </header>

    <div style="padding: 20px; text-align: center">
      <h2>Nuestros Hospedajes</h2>
      <input
        type="text"
        id="buscador"
        placeholder="Buscar..."
        style="padding: 8px; width: 50%; margin-bottom: 20px"
      />
    </div>

    <main
      id="catalogo"
      class="catalogo"
      style="
        display: flex;
        flex-wrap: wrap;
        gap: 20px;
        justify-content: center;
        padding: 20px;
      "
    >
      <p>Cargando hospedajes...</p>
    </main>

    <script>
      // 1. Manejo del Menú (Copiar lógica de index para consistencia)
      const usuario = localStorage.getItem("usuarioLogueado");
      if (usuario) {
        const userObj = JSON.parse(usuario);
        document.getElementById("menuNav").innerHTML = `
                <a href="/index.html">Inicio</a>
                <span style="margin-right:15px">Hola, ${userObj.nombre}</span>
                <a href="#" onclick="logout()" style="color:red">Salir</a>
            `;
      }
      function logout() {
        localStorage.clear();
        window.location.href = "/index.html";
      }

      // 2. Cargar Datos del Backend
      async function cargar() {
        try {
          const res = await fetch("http://localhost:8080/api/hospedajes");
          const data = await res.json();
          const contenedor = document.getElementById("catalogo");
          contenedor.innerHTML = "";

          if (data.length === 0) {
            contenedor.innerHTML = "<h3>No hay hospedajes disponibles.</h3>";
            return;
          }

          data.forEach((h) => {
            const card = document.createElement("div");
            card.className = "card";
            // Estilos inline por si falta el CSS, para que no se vea roto
            card.style =
              "border:1px solid #ddd; border-radius:10px; width:300px; background:white; overflow:hidden; box-shadow:0 4px 8px rgba(0,0,0,0.1)";

            card.innerHTML = `
                        <img src="${h.imagenUrl}" style="width:100%; height:200px; object-fit:cover;" onerror="this.src='/img/logo.jpg'">
                        <div style="padding:15px">
                            <h3 style="margin-top:0">${h.nombre}</h3>
                            <p style="color:#666">📍 ${h.ubicacion}</p>
                            <p>${h.descripcion}</p>
                            <p style="font-weight:bold; color:#205c3b; font-size:1.2em">S/ ${h.precio}</p>
                            <button onclick="alert('Funcionalidad de detalle en siguiente feature')" style="width:100%; padding:10px; background:#205c3b; color:white; border:none; cursor:pointer; border-radius:5px">Ver Detalle</button>
                        </div>
                    `;
            contenedor.appendChild(card);
          });
        } catch (e) {
          console.error(e);
          document.getElementById("catalogo").innerHTML =
            "<p>Error de conexión con el servidor.</p>";
        }
      }
      cargar();
    </script>
  </body>
</html>
