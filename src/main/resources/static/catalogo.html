<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Catálogo | EcoHospedajes Rurales</title>

    <link rel="stylesheet" href="/css/global.css" />
    <link rel="stylesheet" href="/css/catalogo.css" />
  </head>
  <body>
    <header class="navbar">
      <a
        href="/index.html"
        class="logo"
        style="
          text-decoration: none;
          display: flex;
          align-items: center;
          gap: 10px;
        "
      >
        <img src="/img/logo.jpg" alt="Logo" width="45" />
        <span
          style="
            font-weight: bold;
            color: var(--primary-color);
            font-size: 1.2rem;
          "
          >EcoHospedajes</span
        >
      </a>
      <nav id="menuNav"></nav>
    </header>

    <div class="main-layout">
      <aside class="filters-sidebar">
        <h3
          style="
            margin-top: 0;
            color: var(--primary-color);
            border-bottom: 1px solid #eee;
            padding-bottom: 10px;
          "
        >
          Filtros
        </h3>

        <div class="filter-group">
          <label class="filter-title">Ubicación</label>
          <input
            type="text"
            id="filtroUbicacion"
            class="filter-input"
            placeholder="Ej: Cusco, Lima..."
          />
        </div>

        <div class="filter-group">
          <label class="filter-title">Rango de Precio (S/.)</label>
          <div class="price-inputs">
            <input
              type="number"
              id="minPrecio"
              class="filter-input"
              placeholder="Min"
              min="0"
            />
            <span style="align-self: center; font-weight: bold; color: #888"
              >-</span
            >
            <input
              type="number"
              id="maxPrecio"
              class="filter-input"
              placeholder="Max"
              min="0"
            />
          </div>
        </div>

        <div style="display: flex; gap: 10px; margin-top: 20px">
          <button onclick="aplicarFiltros()" class="btn-filter">Aplicar</button>
          <button
            onclick="limpiarFiltros()"
            style="
              flex: 1;
              border: 1px solid #ddd;
              background: white;
              border-radius: 8px;
              cursor: pointer;
              color: #666;
            "
          >
            Limpiar
          </button>
        </div>
      </aside>

      <section>
        <div class="results-header">
          <div class="results-count">
            Encontrados: <b id="totalResultados">0</b> alojamientos
          </div>
        </div>

        <div id="catalogo" class="results-grid">
          <p style="text-align: center; width: 100%">Cargando hospedajes...</p>
        </div>

        <div class="pagination" id="paginacionContainer" style="display: none">
          <button class="page-btn" onclick="cambiarPagina(-1)" id="btnAnterior">
            Anterior
          </button>
          <span class="page-info"
            >Página <span id="pagActual">1</span> de
            <span id="pagTotal">1</span></span
          >
          <button class="page-btn" onclick="cambiarPagina(1)" id="btnSiguiente">
            Siguiente
          </button>
        </div>
      </section>
    </div>

    <footer></footer>

    <script src="/js/logic-navbar.js"></script>
    <script>
      let paginaActual = 0;
      let filtrosActuales = {};

      async function cargar() {
        let url = `http://localhost:8080/api/hospedajes?page=${paginaActual}`;

        if (filtrosActuales.ubicacion)
          url += `&ubicacion=${filtrosActuales.ubicacion}`;
        if (filtrosActuales.min) url += `&minPrice=${filtrosActuales.min}`;
        if (filtrosActuales.max) url += `&maxPrice=${filtrosActuales.max}`;

        try {
          const res = await fetch(url);
          const data = await res.json();

          const contenedor = document.getElementById("catalogo");
          contenedor.innerHTML = "";
          document.getElementById("totalResultados").innerText =
            data.totalElements;

          if (data.content.length === 0) {
            contenedor.innerHTML = `
                        <div style="text-align:center; padding:50px; background:white; border-radius:12px; border:1px solid #eee;">
                            <h3>🔍 No encontramos resultados</h3>
                            <p>Intenta cambiar los filtros de búsqueda.</p>
                        </div>`;
            document.getElementById("paginacionContainer").style.display =
              "none";
            return;
          }

          data.content.forEach((h) => {
            const card = document.createElement("div");
            card.className = "card";
            card.innerHTML = `
                        <img src="${h.imagenUrl}" onerror="this.src='/img/logo.jpg'">
                        <div class="card-body">
                            <div>
                                <h3>${h.nombre}</h3>
                                <div class="card-location">📍 ${h.ubicacion}</div>
                                <p class="card-desc">${h.descripcion}</p>
                            </div>
                            <div class="card-footer">
                                <div class="card-price">S/ ${h.precio} <small>noche</small></div>
                                <button onclick="verDetalle(${h.id})" class="btn-detalle">Ver Detalle</button>
                            </div>
                        </div>
                    `;
            contenedor.appendChild(card);
          });

          actualizarPaginacion(data);
        } catch (e) {
          console.error(e);
          document.getElementById("catalogo").innerHTML =
            "<p>Error de conexión.</p>";
        }
      }

      function actualizarPaginacion(data) {
        const container = document.getElementById("paginacionContainer");
        container.style.display = "flex";

        document.getElementById("pagActual").innerText = data.number + 1;
        document.getElementById("pagTotal").innerText = data.totalPages;

        document.getElementById("btnAnterior").disabled = data.first;
        document.getElementById("btnSiguiente").disabled = data.last;
      }

      function cambiarPagina(delta) {
        paginaActual += delta;
        cargar();
        window.scrollTo({ top: 0, behavior: "smooth" });
      }

      function aplicarFiltros() {
        filtrosActuales = {
          ubicacion: document.getElementById("filtroUbicacion").value,
          min: document.getElementById("minPrecio").value,
          max: document.getElementById("maxPrecio").value,
        };
        paginaActual = 0;
        cargar();
      }

      function limpiarFiltros() {
        document.getElementById("filtroUbicacion").value = "";
        document.getElementById("minPrecio").value = "";
        document.getElementById("maxPrecio").value = "";
        filtrosActuales = {};
        paginaActual = 0;
        cargar();
      }

      function verDetalle(id) {
        window.location.href = `/detalle.html?id=${id}`;
      }

      cargar();
    </script>
  </body>
</html>
