<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <title>Administración | EcoHospedajes</title>
    <link rel="stylesheet" href="/Css/catalogo.css" />
    <style>
      body {
        background-color: #f0f2f5;
      }
      .admin-container {
        max-width: 1100px;
        margin: 30px auto;
        padding: 20px;
      }

      .kpi-grid {
        display: flex;
        gap: 20px;
        margin-bottom: 30px;
      }
      .kpi-card {
        flex: 1;
        background: white;
        padding: 25px;
        border-radius: 8px;
        box-shadow: 0 2px 8px rgba(0, 0, 0, 0.1);
        text-align: center;
      }
      .kpi-num {
        font-size: 2.5em;
        font-weight: bold;
        color: #d63031;
      } /* Rojo para Admin */

      .section-title {
        margin-top: 40px;
        margin-bottom: 15px;
        color: #333;
        border-bottom: 2px solid #ddd;
        padding-bottom: 10px;
      }

      table {
        width: 100%;
        background: white;
        border-collapse: collapse;
        box-shadow: 0 2px 8px rgba(0, 0, 0, 0.1);
        border-radius: 8px;
        overflow: hidden;
      }
      th,
      td {
        padding: 15px;
        text-align: left;
        border-bottom: 1px solid #eee;
      }
      th {
        background-color: #333;
        color: white;
      }

      .btn-delete {
        background: #ffecec;
        color: #d63031;
        border: 1px solid #d63031;
        padding: 5px 10px;
        border-radius: 4px;
        cursor: pointer;
      }
      .btn-delete:hover {
        background: #d63031;
        color: white;
      }
    </style>
  </head>
  <body>
    <header class="navbar" style="background: #333">
      <div class="logo">
        <span style="color: white; font-weight: bold; font-size: 1.2em"
          >🛡️ Panel Admin</span
        >
      </div>
      <nav>
        <a href="/index.html" style="color: white">Ir al Sitio Web</a>
        <a href="#" onclick="logout()" style="color: #ff6b6b">Cerrar Sesión</a>
      </nav>
    </header>

    <div class="admin-container">
      <h1>Resumen del Sistema</h1>

      <div class="kpi-grid">
        <div class="kpi-card">
          <div class="kpi-num" id="totalUsers">0</div>
          <div>Usuarios Registrados</div>
        </div>
        <div class="kpi-card">
          <div class="kpi-num" id="totalHotels">0</div>
          <div>Hospedajes Publicados</div>
        </div>
      </div>

      <h2 class="section-title">Gestión de Usuarios</h2>
      <table>
        <thead>
          <tr>
            <th>ID</th>
            <th>Nombre</th>
            <th>Email</th>
            <th>Rol</th>
            <th>Acciones</th>
          </tr>
        </thead>
        <tbody id="tablaUsuarios">
          <tr>
            <td colspan="5" style="text-align: center">Cargando...</td>
          </tr>
        </tbody>
      </table>
    </div>

    <script>
      // 1. Seguridad: Solo ADMIN entra aquí
      const usuario = JSON.parse(localStorage.getItem("usuarioLogueado"));
      if (!usuario || usuario.rol !== "ADMIN") {
        alert("Zona restringida.");
        window.location.href = "/index.html";
      }

      async function cargarData() {
        try {
          // Cargar KPIs
          const resStats = await fetch("http://localhost:8080/api/admin/stats");
          const stats = await resStats.json();
          document.getElementById("totalUsers").innerText = stats.usuarios;
          document.getElementById("totalHotels").innerText = stats.hospedajes;

          // Cargar Usuarios
          const resUsers = await fetch(
            "http://localhost:8080/api/admin/usuarios"
          );
          const users = await resUsers.json();

          const tbody = document.getElementById("tablaUsuarios");
          tbody.innerHTML = "";

          users.forEach((u) => {
            // No permitimos borrar al propio admin logueado
            const btnBorrar =
              u.email === usuario.email
                ? '<span style="color:#999">Tú</span>'
                : `<button class="btn-delete" onclick="eliminarUsuario(${u.id})">Eliminar</button>`;

            tbody.innerHTML += `
                        <tr>
                            <td>${u.id}</td>
                            <td>${u.nombre} ${u.apellidos}</td>
                            <td>${u.email}</td>
                            <td><span style="font-weight:bold">${u.rol}</span></td>
                            <td>${btnBorrar}</td>
                        </tr>
                    `;
          });
        } catch (error) {
          console.error(error);
          alert("Error cargando panel");
        }
      }

      async function eliminarUsuario(id) {
        if (
          !confirm(
            "¿Estás seguro de eliminar a este usuario? Se borrarán sus reservas y hoteles."
          )
        )
          return;

        try {
          const res = await fetch(
            `http://localhost:8080/api/admin/usuarios/${id}`,
            { method: "DELETE" }
          );
          if (res.ok) {
            alert("Usuario eliminado");
            cargarData(); // Recargar tabla
          } else {
            alert("No se pudo eliminar (Posiblemente tiene datos vinculados)");
          }
        } catch (e) {
          alert("Error de conexión");
        }
      }

      function logout() {
        localStorage.clear();
        window.location.href = "/index.html";
      }

      cargarData();
    </script>
  </body>
</html>
