<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <title>Mis Viajes | EcoHospedajes</title>

    <link rel="stylesheet" href="/css/global.css" />
    <link rel="stylesheet" href="/css/mis-viajes.css" />
  </head>
  <body>
    <header class="navbar">
      <a
        href="/index.html"
        class="logo"
        style="
          text-decoration: none;
          display: flex;
          align-items: center;
          gap: 10px;
        "
      >
        <img src="/img/logo.jpg" alt="Logo" width="45" />
        <span
          style="
            font-weight: bold;
            color: var(--primary-color);
            font-size: 1.2rem;
          "
          >EcoHospedajes</span
        >
      </a>
      <nav id="menuNav"></nav>
    </header>

    <div class="container">
      <div class="page-header">
        <h1>🎒 Mis Próximas Aventuras</h1>
        <p>Gestiona tus reservas y prepara tus maletas.</p>
      </div>

      <div id="listaViajes">
        <p style="text-align: center; color: #888">Cargando tus reservas...</p>
      </div>
    </div>

    <footer></footer>

    <script src="/js/logic-navbar.js"></script>
    <script>
      document.addEventListener("DOMContentLoaded", async () => {
        const contenedor = document.getElementById("listaViajes");
        const token = localStorage.getItem("jwt");

        if (!token) {
          window.location.href = "/login.html";
          return;
        }

        try {
          const response = await fetch("/api/reservas/mis-reservas", {
            method: "GET",
            headers: {
              Authorization: "Bearer " + token,
              "Content-Type": "application/json",
            },
          });

          if (!response.ok) {
            if (response.status === 403 || response.status === 401) {
              localStorage.removeItem("jwt");
              window.location.href = "/login.html";
              return;
            }
            throw new Error("Error " + response.status);
          }

          const reservas = await response.json();

          if (reservas.length === 0) {
            contenedor.innerHTML = `
                <div style="text-align:center; padding: 40px;">
                    <h3>Aún no tienes aventuras reservadas 🎒</h3>
                    <a href="/catalogo.html" class="btn-primary" style="margin-top:20px; display:inline-block; padding: 10px 20px; background-color: #205c3b; color: white; text-decoration: none; border-radius: 5px;">Explorar Destinos</a>
                </div>`;
            return;
          }

          let htmlContent =
            '<div class="reservas-grid" style="display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: 20px; padding: 20px;">';

          reservas.forEach((reserva) => {
            const colorEstado =
              reserva.estado === "CANCELADA" ? "#e74c3c" : "#27ae60";

            const nombreHospedaje = reserva.hospedaje
              ? reserva.hospedaje.nombre
              : "Hospedaje no disponible";
            const imagenHospedaje =
              reserva.hospedaje && reserva.hospedaje.imagenUrl
                ? reserva.hospedaje.imagenUrl
                : "/img/default-hotel.jpg";

            htmlContent += `
                <div class="card-reserva" style="border: 1px solid #ddd; border-radius: 10px; overflow: hidden; box-shadow: 0 4px 6px rgba(0,0,0,0.1); background: white;">
                    <div class="card-header" style="background-color: #f8f9fa; padding: 15px; border-bottom: 1px solid #eee; display: flex; justify-content: space-between; align-items: center;">
                        <span style="font-weight: bold; color: #555;">Reserva #${
                          reserva.id
                        }</span>
                        <span style="background-color: ${colorEstado}; color: white; padding: 4px 12px; border-radius: 20px; font-size: 0.85em; font-weight: 600;">${
              reserva.estado
            }</span>
                    </div>
                    <div class="card-body" style="padding: 20px;">
                        <h3 style="margin: 0 0 15px 0; color: #205c3b; font-size: 1.3em;">${nombreHospedaje}</h3>
                        
                        <div style="font-size: 0.95em; color: #666; display: flex; flex-direction: column; gap: 8px;">
                            <div>📅 <b>Entrada:</b> ${reserva.checkin}</div>
                            <div>📅 <b>Salida:</b> ${reserva.checkout}</div>
                            <div>👥 <b>Viajeros:</b> ${reserva.personas}</div>
                        </div>

                        <div style="margin-top: 20px; padding-top: 15px; border-top: 1px dashed #eee; display: flex; justify-content: space-between; align-items: center;">
                            <span style="font-size: 1.1em; color: #333;">Total:</span>
                            <span style="font-size: 1.4em; font-weight: bold; color: #205c3b;">S/ ${
                              reserva.precioTotal
                            }</span>
                        </div>
                        
                        ${
                          reserva.estado !== "CANCELADA"
                            ? `<button onclick="cancelarReserva(${reserva.id})" style="width: 100%; padding: 12px; background-color: white; border: 2px solid #e74c3c; color: #e74c3c; border-radius: 8px; cursor: pointer; margin-top: 20px; font-weight: bold; transition: all 0.3s;">Cancelar Reserva</button>`
                            : ""
                        }
                    </div>
                </div>
            `;
          });

          htmlContent += "</div>";

          contenedor.innerHTML = htmlContent;
        } catch (error) {
          console.error(error);
          contenedor.innerHTML = `<p style="text-align:center; color: red;">Error al cargar datos: ${error.message}</p>`;
        }
      });

      async function cancelarReserva(id) {
        if (
          !confirm(
            "¿Estás seguro de cancelar esta reserva? Esta acción no se puede deshacer."
          )
        )
          return;

        const token = localStorage.getItem("jwt");
        try {
          const res = await fetch(`/api/reservas/${id}`, {
            method: "DELETE",
            headers: {
              Authorization: "Bearer " + token,
            },
          });

          if (res.ok) {
            alert("✅ Reserva cancelada exitosamente");
            window.location.reload();
          } else {
            const msg = await res.text(); 
            alert("⚠️ No se pudo cancelar: " + (msg || "Error desconocido"));
          }
        } catch (e) {
          console.error(e);
          alert("Error de conexión con el servidor");
        }
      }
    </script>
  </body>
</html>
