<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Panel de Control | EcoHospedajes</title>

    <link rel="stylesheet" href="/css/global.css" />

    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

    <style>
      .dashboard-container {
        max-width: 1200px;
        margin: 40px auto;
        padding: 0 20px;
        min-height: 80vh;
      }

      .header-dash {
        display: flex;
        justify-content: space-between;
        align-items: center;
        margin-bottom: 40px;
      }

      .header-dash h1 {
        margin: 0;
        color: #333;
      }
      .btn-publicar {
        background-color: var(--primary-color);
        color: white;
        padding: 12px 24px;
        border-radius: 8px;
        text-decoration: none;
        font-weight: 600;
        display: flex;
        align-items: center;
        gap: 8px;
        transition: background 0.3s;
      }
      .btn-publicar:hover {
        background-color: var(--primary-dark);
      }

      .kpi-grid {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
        gap: 20px;
        margin-bottom: 40px;
      }

      .kpi-card {
        background: white;
        padding: 25px;
        border-radius: 12px;
        box-shadow: 0 4px 15px rgba(0, 0, 0, 0.05);
        border-left: 5px solid var(--primary-color);
      }
      .kpi-title {
        color: #666;
        font-size: 0.9rem;
        font-weight: 600;
        text-transform: uppercase;
      }
      .kpi-value {
        font-size: 2rem;
        font-weight: 800;
        color: #333;
        margin-top: 10px;
      }

      .charts-grid {
        display: grid;
        grid-template-columns: 2fr 1fr;
        gap: 20px;
        margin-bottom: 40px;
      }

      .chart-card {
        background: white;
        padding: 20px;
        border-radius: 12px;
        box-shadow: 0 4px 15px rgba(0, 0, 0, 0.05);
      }

      .table-card {
        background: white;
        padding: 25px;
        border-radius: 12px;
        box-shadow: 0 4px 15px rgba(0, 0, 0, 0.05);
      }
      .table-card h3 {
        margin-top: 0;
        color: #333;
        margin-bottom: 20px;
      }

      table {
        width: 100%;
        border-collapse: collapse;
      }
      th {
        text-align: left;
        padding: 15px;
        border-bottom: 2px solid #eee;
        color: #666;
      }
      td {
        padding: 15px;
        border-bottom: 1px solid #eee;
        color: #333;
      }

      .estado-select {
        padding: 6px 10px;
        border-radius: 6px;
        border: 1px solid #ccc;
        cursor: pointer;
      }

      @media (max-width: 900px) {
        .charts-grid {
          grid-template-columns: 1fr;
        }
      }
    </style>
  </head>

  <body>
    <header class="navbar">
      <a
        href="/index.html"
        class="logo"
        style="text-decoration: none; display: flex; align-items: center; gap: 10px;"
      >
        <img src="/img/logo.jpg" alt="Logo" width="45" />
        <span
          style="font-weight: bold; color: var(--primary-color); font-size: 1.2rem;"
          >EcoHospedajes</span
        >
      </a>
      <nav id="menuNav"></nav>
    </header>

    <div class="dashboard-container">
      <div class="header-dash">
        <div>
          <h1>Panel de Control</h1>
          <p style="color: #666; margin-top: 5px">
            Bienvenido de nuevo, <span id="nombreUser">...</span>
          </p>
        </div>
        <a href="/dueno/registrar-hospedaje.html" class="btn-publicar">
          <span>+</span> Publicar Hospedaje
        </a>
      </div>

      <div class="kpi-grid">
        <div class="kpi-card">
          <div class="kpi-title">Ganancias Totales</div>
          <div class="kpi-value" id="kpiGanancias">S/ 0.00</div>
        </div>
        <div class="kpi-card">
          <div class="kpi-title">Reservas Totales</div>
          <div class="kpi-value" id="kpiReservas">0</div>
        </div>
        <div class="kpi-card" style="border-left-color: #f39c12">
          <div class="kpi-title">Mis Propiedades</div>
          <div class="kpi-value" id="kpiHoteles">0</div>
        </div>
      </div>

      <div class="charts-grid">
        <div class="chart-card">
          <h3 style="margin-bottom: 15px; color: #333">Ingresos Mensuales</h3>
          <canvas id="barChart"></canvas>
        </div>

        <div class="chart-card">
          <h3 style="margin-bottom: 15px; color: #333">Ocupación</h3>
          <canvas id="doughnutChart"></canvas>
        </div>
      </div>

      <div class="table-card">
        <h3>Últimas Reservas</h3>
        <table>
          <thead>
            <tr>
              <th>Huésped</th>
              <th>Hospedaje</th>
              <th>Fechas</th>
              <th>Total</th>
              <th>Estado</th>
            </tr>
          </thead>
          <tbody id="tablaBody">
            <tr>
              <td colspan="5" style="text-align: center">Cargando datos...</td>
            </tr>
          </tbody>
        </table>
      </div>
    </div>

    <footer></footer>

    <script src="/js/logic-navbar.js"></script>

    <script>
      const usuario = JSON.parse(localStorage.getItem("usuarioLogueado"));
      const token = localStorage.getItem("jwt");

      if (!usuario || usuario.rol !== "DUENO" || !token) {
        window.location.href = "/index.html";
      }

      document.getElementById("nombreUser").innerText = usuario.nombre;

      let myBarChart = null;
      let myDoughnutChart = null;

      function initCharts(meses, montos, confirmadas, canceladas) {
        if (myBarChart) myBarChart.destroy();
        if (myDoughnutChart) myDoughnutChart.destroy();

        myBarChart = new Chart(document.getElementById("barChart"), {
          type: "bar",
          data: {
            labels: meses,
            datasets: [
              {
                label: "Ingresos (S/.)",
                data: montos,
                backgroundColor: "#205c3b",
                borderRadius: 5,
              },
            ],
          },
          options: {
            responsive: true,
            plugins: { legend: { display: false } },
          },
        });

        myDoughnutChart = new Chart(document.getElementById("doughnutChart"), {
          type: "doughnut",
          data: {
            labels: ["Confirmadas", "Canceladas"],
            datasets: [
              {
                data: [confirmadas, canceladas],
                backgroundColor: ["#205c3b", "#d63031"],
              },
            ],
          },
          options: { responsive: true },
        });
      }

      async function cargarDashboard() {
        try {
          const res = await fetch(`/api/dashboard/${usuario.id}`, {
            method: "GET",
            headers: {
              Authorization: "Bearer " + token,
            },
          });

          if (!res.ok) throw new Error("Error carga dashboard");

          const data = await res.json();

          document.getElementById("kpiGanancias").innerText =
            "S/ " + data.kpi_ganancias.toFixed(2);
          document.getElementById("kpiReservas").innerText = data.kpi_reservas;
          document.getElementById("kpiHoteles").innerText = data.kpi_hoteles;

          initCharts(
            data.grafico_etiquetas,
            data.grafico_valores,
            parseInt(data.total_confirmadas),
            parseInt(data.total_canceladas)
          );

          const tbody = document.getElementById("tablaBody");
          tbody.innerHTML = "";

          if (data.tabla_reservas.length === 0) {
            tbody.innerHTML =
              `<tr><td colspan='5' style='text-align:center; padding:20px'>No hay reservas aún.</td></tr>`;
          } else {
            data.tabla_reservas.forEach((r) => {
              tbody.innerHTML += `
                <tr>
                  <td>${r.usuario.nombre} ${r.usuario.apellidos}</td>
                  <td>${r.hospedaje.nombre}</td>
                  <td>${r.checkin} ➝ ${r.checkout}</td>
                  <td style="font-weight:bold">S/ ${r.precioTotal}</td>
                  <td>
                    <select class="estado-select" data-id="${r.id}">
                      <option value="CONFIRMADA" ${r.estado === "CONFIRMADA" ? "selected" : ""}>CONFIRMADA</option>
                      <option value="CANCELADA" ${r.estado === "CANCELADA" ? "selected" : ""}>CANCELADA</option>
                    </select>
                  </td>
                </tr>`;
            });
          }
        } catch (error) {
          console.error(error);
          alert("Error al cargar el panel.");
        }
      }

      document.addEventListener("change", async (e) => {
        if (e.target.classList.contains("estado-select")) {
          const reservaId = e.target.dataset.id;
          const nuevoEstado = e.target.value;

          const res = await fetch(`/api/reservas/${reservaId}/estado`, {
            method: "PUT",
            headers: {
              "Content-Type": "application/json",
              Authorization: "Bearer " + token,
            },
            body: JSON.stringify({ estado: nuevoEstado }),
          });

          if (res.ok) {
            alert("Estado actualizado");
            cargarDashboard();
          } else {
            alert("Error al actualizar estado");
          }
        }
      });

      cargarDashboard();
    </script>
  </body>
</html>
