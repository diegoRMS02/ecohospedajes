<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Iniciar Sesión | EcoHospedajes Rurales</title>
    <link rel="stylesheet" href="/css/login.css" />
  </head>
  <body>
    <div class="login-container">
      <div class="login-box">
        <div class="logo">
          <img src="/img/logo.jpg" alt="Logo" />
          <h2>EcoHospedajes Rurales</h2>
        </div>

        <h1>Inicia sesión</h1>

        <form id="loginForm">
          <input
            type="email"
            id="email"
            placeholder="Correo electrónico"
            required
          />
          <input
            type="password"
            id="contrasena"
            placeholder="Contraseña"
            required
          />
          <button type="submit">Entrar</button>
        </form>

        <p class="switch-text">
          ¿No tienes una cuenta?
          <a href="/registrate.html">Regístrate aquí</a>
        </p>

        <p class="switch-text">
          Registrate como dueño
          <a href="/registrar-dueño.html">Regístrate aquí</a>
        </p>
      </div>
    </div>

    <script>
      document
        .getElementById("loginForm")
        .addEventListener("submit", async (event) => {
          event.preventDefault();

          const email = document.getElementById("email").value;
          const contrasena = document.getElementById("contrasena").value;

          try {
            // 1. CONEXIÓN AL BACKEND
            const response = await fetch(
              "http://localhost:8080/api/usuarios/login",
              {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                // Mapeamos 'contrasena' del input a 'password' que espera Java
                body: JSON.stringify({ email: email, password: contrasena }),
              }
            );

            // 2. RESPUESTA DEL SERVIDOR
            if (response.ok) {
              const data = await response.json();

              // 3. GUARDAR SESIÓN EN EL NAVEGADOR
              localStorage.setItem("usuarioLogueado", JSON.stringify(data));
              localStorage.setItem("usuarioId", data.id);
              localStorage.setItem("usuarioRol", data.rol);

              // 4. REDIRECCIÓN INTELIGENTE SEGÚN ROL
              if (data.rol === "DUENO") {
                // El dueño va a su panel de control (Dashboard)
                window.location.href = "/dashboard-dueno.html";
              } else {
                // El cliente va al catálogo a gastar dinero
                window.location.href = "/catalogo.html";
              }
            } else {
              alert("❌ Credenciales incorrectas. Intenta de nuevo.");
            }
          } catch (error) {
            console.error("Error:", error);
            alert("❌ Error de conexión con el servidor");
          }
        });
    </script>
  </body>
</html>
