<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Formulario de Pago</title>
    <link rel="stylesheet" href="/Css/inicio.css" />
    <style>
        body { font-family: Arial, sans-serif; background: #f2f2f2; margin:0; padding-top:120px; }
        .container { width:380px; background:white; padding:25px; border-radius:10px; box-shadow:0 0 15px rgba(0,0,0,0.2); margin:auto; }
        h2 { text-align:center; margin-bottom:20px; color:#046d63; }
        input, select { width:100%; padding:10px; margin-top:12px; border:1px solid #aaa; border-radius:5px; }
        button { width:100%; margin-top:20px; padding:12px; background:#00a884; color:white; border:none; border-radius:5px; cursor:pointer; font-size:16px; }
        button:hover { background:#008f72; }
        #success-msg { display:none; background:#4CAF50; color:white; padding:15px; border-radius:8px; text-align:center; margin-bottom:15px; animation:fadeIn .6s; }
        @keyframes fadeIn { from{opacity:0;transform:translateY(-20px)} to{opacity:1;transform:translateY(0)} }
        header.navbar { position:fixed; top:0; left:0; width:100%; z-index:999; background:#fff; box-shadow:0 2px 6px rgba(0,0,0,0.08); }
    </style>
</head>
<body>
<header class="navbar">
    <div style="display:flex;align-items:center;gap:12px;padding:10px 20px;">
        <img src="/img/logo.jpg" alt="Logo" style="height:40px;border-radius:6px;">
        <nav>
            <a href="/">Inicio</a> |
            <a href="/catalogo.html">Catálogo</a> |
            <a href="/login.html">Iniciar Sesión</a> |
            <a href="/payments/pago-form">Pagos</a>
        </nav>
    </div>
</header>

<div class="container">
    <div id="success-msg">✔ Gracias por realizar su pago</div>
    <h2>Formulario de Pago</h2>

    <form id="paymentForm">
        <label>Nombres:</label>
        <input type="text" id="firstName" required>

        <label>Apellidos:</label>
        <input type="text" id="lastName" required>

        <label>Correo electrónico:</label>
        <input type="email" id="email" required>

        <label>Número (celular):</label>
        <input type="text" id="phone" required>

        <label>Número de tarjeta:</label>
        <input type="text" id="cardNumber" maxlength="19" placeholder="4111 1111 1111 1111" required>

        <label>Fecha de vencimiento:</label>
        <input type="month" id="expiryDate" required>

        <label>CVV (3 dígitos):</label>
        <input type="text" id="cvv" maxlength="4" placeholder="123" required>

        <label>Monto:</label>
        <input type="number" step="0.01" id="amount" required>

        <label>Método:</label>
        <select id="method" required>
            <option value="CARD">Tarjeta</option>
            <option value="YAPE">Yape</option>
            <option value="PLIN">Plin</option>
        </select>

        <label>ID Reserva:</label>
        <input type="number" id="reservationId" required>

        <button type="submit">Pagar ahora</button>
    </form>
</div>

<script>
document.getElementById("paymentForm").addEventListener("submit", function(event) {
    event.preventDefault();

    // Reúne datos
    const formData = new URLSearchParams();
    formData.append("firstName", document.getElementById("firstName").value);
    formData.append("lastName", document.getElementById("lastName").value);
    formData.append("email", document.getElementById("email").value);
    formData.append("phone", document.getElementById("phone").value);

    formData.append("cardNumber", document.getElementById("cardNumber").value.replace(/\s+/g,''));
    formData.append("expiryDate", document.getElementById("expiryDate").value);
    formData.append("cvv", document.getElementById("cvv").value); // NO se almacenará en el backend en la entidad

    formData.append("amount", document.getElementById("amount").value);
    formData.append("method", document.getElementById("method").value);
    formData.append("reservationId", document.getElementById("reservationId").value);

    fetch("/payments/create", {
        method: "POST",
        headers: { "Content-Type": "application/x-www-form-urlencoded" },
        body: formData
    })
    .then(response => response.text())
    .then(data => {
        if (data === "OK") {
            const msg = document.getElementById("success-msg");
            msg.style.display = "block";
            document.getElementById("paymentForm").reset();

            // 3s luego redirige al índice
            setTimeout(() => window.location.href = "/", 3000);
        } else {
            alert("Error: " + data);
        }
    })
    .catch(err => alert("Error al enviar: " + err));
});
</script>
</body>
</html>
