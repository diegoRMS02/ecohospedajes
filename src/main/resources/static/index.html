<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Inicio - EcoHospedajes Rurales</title>
    <link rel="stylesheet" href="/css/index.css" />
  </head>
  <body>
    <header class="navbar">
      <div class="logo">
        <img src="/img/logo.jpg" alt="Logo" class="icono" />
        <div>
          <h1>EcoHospedajes Rurales</h1>
          <p>Reservas en hospedajes rurales</p>
        </div>
      </div>
      <nav id="menuNav">
        <a href="/index.html">Inicio</a>
        <a href="/catalogo.html">Catálogo</a>
        <a href="/login.html">Iniciar Sesión</a>
      </nav>
    </header>

    <section class="hero">
      <div class="hero-content">
        <h2>Descubre la tranquilidad del campo</h2>
        <p>Escápate del ruido y vive una experiencia rural única.</p>
        <a href="/catalogo.html" class="btn">Explorar hospedajes</a>
      </div>
    </section>

    <script>
      const usuarioStorage = localStorage.getItem("usuarioLogueado");
      const nav = document.getElementById("menuNav");

      if (usuarioStorage) {
        const usuario = JSON.parse(usuarioStorage);

        // Variable para guardar el botón especial según el rol
        let botonRol = "";

        if (usuario.rol === "DUENO") {
          // Si es dueño, le damos acceso a su Dashboard
          botonRol = `<a href="/dashboard-dueno.html" style="font-weight:bold; color:#205c3b; border: 2px solid #205c3b; padding: 5px 10px; border-radius: 5px;">Ir a mi Panel</a>`;
        } else if (usuario.rol === "CLIENTE") {
          // Si es cliente, le daremos acceso a sus viajes (Feature 6)
          botonRol = `<a href="/perfil.html">Mis Viajes</a>`;
        } else if (usuario.rol === "ADMIN") {
          botonRol = `<a href="/admin/panel.html">Administración</a>`;
        }

        // Inyectamos el menú personalizado
        nav.innerHTML = `
                <a href="/index.html">Inicio</a>
                <a href="/catalogo.html">Catálogo</a>
                ${botonRol} <span style="margin-left:10px; color:#555">Hola, <b>${usuario.nombre}</b> (${usuario.rol})</span>
                <a href="#" onclick="logout()" style="color:red; margin-left:10px">Salir</a>
            `;
      }

      function logout() {
        localStorage.clear();
        window.location.reload();
      }
    </script>
  </body>
</html>
